<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ressources créatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1f14;--soft:#4a3826;--rule:rgba(42,31,20,.4);--bg:#fbf8f3;--serif:"Fraunces",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;color:var(--ink);font:17px/1.5 var(--serif);
background:var(--bg)}
main{max-width:880px;margin:0 auto;padding:48px 24px 32px}
.kicker,.meta,.count,footer,.chip,select,.btn,label{font-family:var(--mono)}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:0 0 12px}
h1{font-weight:600;font-size:clamp(40px,8vw,72px);line-height:1;letter-spacing:-.02em;margin:0 0 16px}
.lede{max-width:560px;margin:0 0 24px;color:var(--soft)}
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border:1px solid var(--ink)}
.btn:hover{background:transparent;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tools{margin-top:40px;border-top:2px solid var(--ink);padding-top:20px}
#q{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);font:400 24px var(--serif);color:var(--ink);padding:8px 0}
#q::placeholder{color:var(--soft);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.chip{background:transparent;color:var(--ink);border:1px solid var(--ink);font-size:12px;padding:5px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin-top:20px}
label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);display:flex;flex-direction:column;gap:4px}
select{background:transparent;color:var(--ink);border:1px solid var(--ink);font-size:13px;padding:6px 8px;min-width:150px}
details{margin-top:16px}
summary{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--soft)}
.reset{background:none;border:0;border-bottom:1px solid var(--ink);font:12px var(--mono);color:var(--ink);cursor:pointer;padding:0 0 2px}
.count{font-size:12px;color:var(--soft);margin:28px 0 0}
ol{list-style:none;margin:8px 0 0;padding:0}
li{border-top:1px solid var(--rule);padding:18px 0;display:grid;grid-template-columns:44px 1fr;gap:0 8px}
.num{font:12px var(--mono);color:var(--soft);padding-top:9px}
.name{font-weight:600;font-size:22px;line-height:1.2;color:var(--ink);text-decoration-thickness:1px;text-underline-offset:4px}
a.name:hover{text-decoration-thickness:2px}
.desc{margin:6px 0 8px;max-width:660px}
.meta{font-size:12px;color:var(--soft);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.tag{background:none;border:0;padding:0;font:12px var(--mono);color:var(--soft);cursor:pointer}
.tag:hover,.tag.on{color:var(--ink);text-decoration:underline}
.report{margin-left:auto;font:11px var(--mono);color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.report:hover{color:var(--ink)}
footer{border-top:2px solid var(--ink);margin-top:32px;padding-top:12px;font-size:11px;letter-spacing:.06em;color:var(--soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:560px){main{padding-top:32px}select{min-width:0;width:100%}.row>label{flex:1 1 100%}}
</style>
</head>
<body>
<main>
<header>
  <p class="kicker">Bibliothèque de classe</p>
  <h1>Ressources créatives</h1>
  <p class="lede">Sites, outils, livres, chaînes et lieux pour nourrir la pratique. Cherche, filtre, puis propose tes propres trouvailles.</p>
  <a class="btn" id="add" href="#" target="_blank" rel="noopener">Proposer une ressource</a>
</header>

<section class="tools" aria-label="Recherche et filtres">
  <label for="q" style="display:none">Rechercher</label>
  <input id="q" type="search" placeholder="Chercher : palette, packaging, 3d…" autocomplete="off">
  <div class="chips" id="cats" role="group" aria-label="Catégories"></div>
  <div class="row">
    <label>Format<select id="fmt"></select></label>
    <label>Coût<select id="cout"></select></label>
    <button class="reset" id="reset" type="button">Tout réinitialiser</button>
  </div>
  <details><summary>Tags</summary><div class="chips" id="tagbox"></div></details>
</section>

<p class="count" id="count" aria-live="polite"></p>
<ol id="list"></ol>

<footer><span>Une bibliothèque faite par et pour la classe.</span><span>Dernière mise à jour : <time id="upd">…</time></span></footer>
</main>

<script>
// À remplacer par le lien PUBLIC de ton Google Form (celui qui se termine par /viewform).
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeU2Mgs_aAL0IVfDR-8eqCGIHal4nql9e5-ZE1ji-G97HHwUA/viewform";

const $ = id => document.getElementById(id);
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const state = { q: "", cat: "", fmt: "", cout: "", tags: new Set() };
let items = [];
const REPORT_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeHnsm-PTDu3ZVV3M7-h0wVdeJ0JIvw7bCDYI-2CxVcrcyxaA/viewform?usp=pp_url&entry.1440215143=MODELE";

$("add").href = FORM_URL;

function option(sel, label, value) { const o = el("option", "", label); o.value = value; sel.appendChild(o); }
function fillSelect(sel, all, values) { sel.innerHTML = ""; option(sel, all, ""); values.forEach(v => option(sel, v, v)); }
const uniq = arr => [...new Set(arr)].filter(Boolean).sort((a, b) => a.localeCompare(b, "fr"));

function chip(box, label, pressed, onClick, cls) {
  const b = el("button", cls || "chip", label); b.type = "button"; b.setAttribute("aria-pressed", pressed);
  b.addEventListener("click", onClick); box.appendChild(b);
}

function buildControls() {
  const cats = uniq(items.map(i => i.categorie));
  const box = $("cats"); box.innerHTML = "";
  cats.forEach(c => chip(box, c, state.cat === c, () => { state.cat = state.cat === c ? "" : c; buildControls(); render(); }));
  fillSelect($("fmt"), "Tous", uniq(items.map(i => i.format))); $("fmt").value = state.fmt;
  fillSelect($("cout"), "Tous", uniq(items.map(i => i.cout))); $("cout").value = state.cout;
  const tb = $("tagbox"); tb.innerHTML = "";
  uniq(items.flatMap(i => i.tags)).filter(t => t !== "à-classer")
    .forEach(t => chip(tb, t, state.tags.has(t), () => toggleTag(t)));
}

function toggleTag(t) { state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); buildControls(); render(); }

function matches(i) {
  if (state.cat && i.categorie !== state.cat) return false;
  if (state.fmt && i.format !== state.fmt) return false;
  if (state.cout && i.cout !== state.cout) return false;
  for (const t of state.tags) if (!i.tags.includes(t)) return false;
  if (state.q) {
    const hay = norm([i.nom, i.categorie, i.format, i.tags.join(" "), i.description].join(" "));
    return norm(state.q).split(/\s+/).every(w => hay.includes(w));
  }
  return true;
}

function safeUrl(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch (e) { return ""; } }

function render() {
  const list = $("list"); list.innerHTML = "";
  const res = items.filter(matches);
  $("count").textContent = res.length + (res.length > 1 ? " ressources" : " ressource") + " sur " + items.length;
  if (!res.length) { const li = el("li", "", "Rien ne correspond. Essaie un autre mot ou réinitialise les filtres."); li.style.display = "block"; list.appendChild(li); return; }
  res.forEach(i => {
    const li = el("li"), body = el("div"); const url = safeUrl(i.lien);
    li.appendChild(el("span", "num", i.n ? String(i.n).padStart(3, "0") : "—"));
    const name = url ? el("a", "name", i.nom) : el("span", "name", i.nom);
    if (url) { name.href = url; name.target = "_blank"; name.rel = "noopener noreferrer"; }
    body.appendChild(name);
    body.appendChild(el("p", "desc", i.description));
    body.appendChild(el("p", "meta", [i.categorie, i.format, i.cout].filter(Boolean).join("  ·  ") + (i.verif ? "  ·  à confirmer" : "")));
    const tg = el("div", "tags");
    i.tags.filter(t => t !== "à-classer").forEach(t => {
      const b = el("button", "tag" + (state.tags.has(t) ? " on" : ""), "#" + t); b.type = "button";
      b.addEventListener("click", () => toggleTag(t)); tg.appendChild(b);
    });
    if (REPORT_URL.includes("/viewform")) {
      const label = (i.n ? "n° " + String(i.n).padStart(3, "0") + " – " : "") + i.nom;
      const rp = el("a", "report", "Signaler un problème");
      rp.href = REPORT_URL.replace("MODELE", encodeURIComponent(label));
      rp.target = "_blank"; rp.rel = "noopener"; rp.title = "Signaler un problème sur cette fiche"; tg.appendChild(rp);
    }
    body.appendChild(tg); li.appendChild(body); list.appendChild(li);  });
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("fmt").addEventListener("change", e => { state.fmt = e.target.value; render(); });
$("cout").addEventListener("change", e => { state.cout = e.target.value; render(); });
$("reset").addEventListener("click", () => {
  Object.assign(state, { q: "", cat: "", fmt: "", cout: "" }); state.tags.clear(); $("q").value = ""; buildControls(); render();
});

fetch("data.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  items = d.items.sort((a, b) => ((a.n || 1e9) - (b.n || 1e9)) || a.nom.localeCompare(b.nom, "fr"));
  $("upd").textContent = new Date(d.updated + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  $("upd").dateTime = d.updated;
  buildControls(); render();
}).catch(() => { $("count").textContent = "Impossible de charger les ressources pour le moment."; });
</script>
<script data-goatcounter="https://flotte-studio.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
